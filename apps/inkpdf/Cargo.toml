[package]
name = "inkpdf"
description = "Pen-first PDF annotator for Windows"
version = "1.7.0"
authors = ["Rajat Mandal"]
edition.workspace = true
license.workspace = true
publish = false

# Not `[lints] workspace = true`: the workspace forbids unsafe code, and reading the pen
# through Win32 pointer messages (M2) needs it, confined to one small module.

# The program is the library; the binary below is only its entry point (the Android library is another).
[lib]
name = "inkpdf"
path = "src/lib.rs"

[[bin]]
name = "inkpdf"
path = "src/main.rs"

# Drives a running InkPDF window with synthetic pen and touch input, for end-to-end tests.
[[bin]]
name = "inkpdf-bot"
path = "src/bin/bot.rs"

# Writes a many-page test PDF for scroll and zoom benchmarks.
[[bin]]
name = "inkpdf-gen"
path = "src/bin/gen.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
# The extension API, and the extensions built in (see docs/EXTENSIONS.md): the program serves the one and loads the other.
inkpdf-api = { path = "../inkpdf-api" }
inkpdf-ext = { path = "../inkpdf-ext" }
pdfcraft-cos = { workspace = true }
pdfcraft-annot = { workspace = true }
pdfcraft-render = { workspace = true }
pdfcraft-create = { workspace = true }
pdfcraft-organize = { workspace = true }
pdfcraft-forms = { workspace = true }
png = "0.18"
wgpu = { version = "30", features = ["wgsl"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
# Typed text: reads the outlines of a system font (the same font parser the page renderer uses).
skrifa = "0.47"

# The system's file dialogs on a desktop (Android has none this crate can use: its picker is an Intent, see `platform::saf`).
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = { workspace = true }

# Linux: a window on Wayland or X11, whichever the session runs (decided when the window is made). The Wayland client
# library is loaded when needed, so one binary starts on either.
[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
# The system clipboard: Wayland's data-control protocol where the compositor has it, X11's selections otherwise (see `platform/linux/clipboard.rs`).
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
# The pen on Wayland: the tablet protocol, read on winit's own connection (see `platform/linux/tablet.rs`). The versions are the ones winit uses.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

# Android: NativeActivity (no Java glue to start with; the file picker and clipboard will need a little, see docs/PORTING.md).
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "android-native-activity"] }
# The monotonic clock the input events are stamped with (see `platform/android/reader.rs`).
libc = "0.2"
# The calls into the Java side of the app (the file picker, the clipboard, opening links): see `platform/android/host.rs`.
jni = "0.21"

[target.'cfg(windows)'.dependencies]
# Pen and touch arrive as Windows pointer messages: winit reports only pressure and cannot tell a
# pen from a finger, so `win_pointer` reads them directly.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Input_Touch",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# A compositor of our own, in the tests of the Wayland pen reader (it says what a tablet would, over a socket pair).
[target.'cfg(all(unix, not(target_os = "android")))'.dev-dependencies]
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server", "unstable"] }
